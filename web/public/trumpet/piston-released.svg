<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180">
  <defs>
    <linearGradient id="casing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F4E4A6"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="casingEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B5210"/>
      <stop offset="8%" stop-color="#6B5210" stop-opacity="0"/>
      <stop offset="92%" stop-color="#6B5210" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6B5210"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4E4A6"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="80%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Casing: vertical brass cylinder -->
  <rect x="20" y="88" width="80" height="84" rx="4"
        fill="url(#casing)" stroke="#5C4710" stroke-width="1"/>
  <!-- Inset edge shading for cylinder curvature -->
  <rect x="20" y="88" width="80" height="84" rx="4" fill="url(#casingEdge)"/>
  <!-- Decorative line where the button stem enters the casing -->
  <line x1="21" y1="96" x2="99" y2="96" stroke="#5C4710" stroke-width="1" opacity="0.5"/>
  <line x1="21" y1="99" x2="99" y2="99" stroke="#F4E4A6" stroke-width="0.6" opacity="0.4"/>

  <!-- Finger button: domed disc hovering above the casing -->
  <ellipse cx="60" cy="60" rx="30" ry="11"
           fill="url(#button)" stroke="#5C4710" stroke-width="1"/>
  <!-- Specular highlight on the button -->
  <ellipse cx="53" cy="56" rx="12" ry="2.5" fill="white" opacity="0.45"/>
</svg>
